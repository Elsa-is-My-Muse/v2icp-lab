name: Local lab tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Find Windows OpenSSL if needed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $directory = 'C:\Program Files\Git\usr\bin'
            if (-not (Test-Path (Join-Path $directory 'openssl.exe'))) { throw 'OpenSSL not found' }
            $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - run: python --version
      - run: openssl version
      - run: python -m unittest discover -s tests -v
      - run: python -m demo.run_demo --interval 0.1 --cycles 2
      - run: python tools/release_check.py
  c-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and run host-only boundary
        run: |
          mkdir -p output
          gcc -std=c99 -Wall -Wextra -Werror -pedantic embedded/v2icp_boundary.c embedded/example_boundary.c -o output/boundary_test
          ./output/boundary_test
