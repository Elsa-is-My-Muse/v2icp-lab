<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc">
  <title id="title">V2ICP Lab reference hardware architecture</title>
  <desc id="desc">Solid boxes represent the tested PC lab. Dashed boxes represent planned low-voltage hardware integration, not verified wiring.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse"><path d="M0 0 L8 3 L0 6" fill="#237d71"/></marker><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#183d44} .title{font-size:27px;font-weight:700}.heading{font-size:19px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#5e7378}.box{fill:#fff;stroke:#c7d9d6;stroke-width:2}.planned{fill:#fff;stroke:#a6b6c0;stroke-width:2;stroke-dasharray:8 5}.arrow{fill:none;stroke:#237d71;stroke-width:2;marker-end:url(#arrow)}.future{fill:none;stroke:#7a8f9c;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="750" rx="20" fill="#f3f7f5"/>
  <text x="40" y="48" class="title">V2ICP Lab / 硬件接入参考架构</text>
  <text x="40" y="78" class="small">Original reference only · No PCB, pinout or high-voltage wiring · 2026-11-20</text>
  <rect x="30" y="108" width="1220" height="218" rx="14" fill="#e4f3ed"/>
  <text x="52" y="141" class="heading">A / 已验证：一台 PC 内的真实 IPv6 / TLS / HTTP</text>
  <rect x="54" y="169" width="240" height="95" rx="9" class="box"/><text x="74" y="204" class="heading">浏览器 + EVCC 模拟器</text><text x="74" y="235" class="body">Web 控制 / 独立 TLS 客户端</text>
  <rect x="500" y="169" width="250" height="95" rx="9" class="box"/><text x="520" y="204" class="heading">SECC 字节中继演示</text><text x="520" y="235" class="body">只转发加密字节，不解密</text>
  <rect x="951" y="169" width="246" height="95" rx="9" class="box"/><text x="971" y="204" class="heading">模拟调度后台</text><text x="971" y="235" class="body">验证身份 / 返回测试计划</text>
  <path d="M300 215 H488" class="arrow"/><text x="329" y="202" class="small">IPv6 ::1 / TLS</text><path d="M760 215 H940" class="arrow"/><text x="791" y="202" class="small">IPv6 ::1 / TLS</text>
  <text x="55" y="300" class="small">回环随机端口 · 中继不是生产网关 · 没有真实 PLC / VAS / CAN / 充电连接</text>
  <text x="51" y="374" class="heading">B / 待验证：现有 EVCC / SECC 的低压集成目标</text>
  <rect x="53" y="404" width="280" height="132" rx="9" class="planned"/><text x="73" y="439" class="heading">EVCC 控制板</text><text x="73" y="468" class="body">充电连接 A / V2ICP 连接 B</text><text x="73" y="495" class="body">独立 socket / TLS / 缓冲 / 定时</text><text x="73" y="519" class="small">MCU / PLC / RAM 以实际板图为准</text>
  <rect x="500" y="404" width="280" height="132" rx="9" class="planned"/><text x="520" y="439" class="heading">SECC + 实际网络接入</text><text x="520" y="468" class="body">VAS + IPv6 路由 / 访问控制</text><text x="520" y="495" class="body">独立网关或已核实主机栈方案</text><text x="520" y="519" class="small">不能假设现有 W5500 socket 可用</text>
  <rect x="951" y="404" width="246" height="132" rx="9" class="planned"/><text x="971" y="439" class="heading">运营方真实后台</text><text x="971" y="468" class="body">地址 / 证书 / 每车凭据</text><text x="971" y="495" class="body">计划 / 审计 / 恢复策略</text><text x="971" y="519" class="small">公网访问与生产部署不在本例内</text>
  <path d="M344 443 H489" class="future"/><text x="346" y="428" class="small">PLC / 原充电 A</text><path d="M344 506 H489" class="future"/><text x="350" y="492" class="small">独立数据连接 B</text><path d="M789 477 H940" class="future"/><text x="803" y="460" class="small">IPv6 / HTTPS</text>
  <rect x="53" y="596" width="560" height="95" rx="9" class="planned"/><text x="73" y="628" class="heading">整车授权接口 / 安全策略 / VCU / BMS / HVAC</text><text x="73" y="659" class="body">后台目标只入策略队列；未知、过期、越界均不得直通执行器</text><path d="M195 543 V586" class="future"/>
  <text x="657" y="622" class="body">虚线 = 设计目标，未上板验收</text><text x="657" y="649" class="small">引脚 / 电平 / 电源 / 隔离 / DBC 均需合法资料和实测</text><text x="657" y="675" class="small">不包含高压接线指导；由合格人员执行适用安全流程</text>
  <text x="43" y="727" class="small">V2ICP LAB · 软件开源 + 硬件接入参考资料 ≠ 已交付可制造硬件</text>
</svg>
